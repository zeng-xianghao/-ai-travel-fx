<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>AuroraMap AI Sticker Studio V11.5</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      color: #111827;
      overscroll-behavior: none;
    }
    body { padding-bottom: env(safe-area-inset-bottom); }
    .app { max-width: 430px; margin: 0 auto; padding: 16px 14px 96px; }
    .hero { margin: 8px 0 16px; }
    .hero h1 { margin: 0; font-size: 30px; font-weight: 900; }
    .hero p { margin: 6px 0 0; color: #64748b; font-size: 13px; line-height: 1.6; }

    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 14px;
    }

    .board-card {
      background: transparent;
      backdrop-filter: none;
      border: 0;
      box-shadow: none;
      padding: 0;
    }

    h2 { margin: 0 0 12px; font-size: 18px; font-weight: 900; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .preview {
      height: 220px;
      border: 2px dashed #93c5fd;
      border-radius: 22px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      text-align: center;
      color: #64748b;
    }
    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .preview.show img { display: block; }
    .preview.show .placeholder { display: none; }
    .placeholder { padding: 16px; line-height: 1.8; font-size: 14px; }
    input[type=file] { display: none; }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary { background: #111827; }
    button.ghost { background: #eef2ff; color: #3730a3; }

    .status {
      background: #eff6ff;
      border-radius: 18px;
      padding: 12px 14px;
      color: #1d4ed8;
      font-size: 14px;
      line-height: 1.7;
      min-height: 72px;
      margin-top: 12px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #111827;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .board-title {
      padding: 0 2px 10px;
      font-size: 18px;
      font-weight: 900;
    }

    .board-wrap {
      position: relative;
      background: linear-gradient(180deg, #fff7e8, #efd09b);
      border-radius: 30px;
      padding: 10px;
      box-shadow:
        inset 0 0 0 10px rgba(255,255,255,.16),
        inset 0 0 28px rgba(141,96,36,.18),
        0 12px 32px rgba(91,53,10,.14);
    }

    .board {
      height: 500px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 16px 16px, rgba(255,255,255,.28) 0 2px, transparent 3px) 0 0/34px 34px,
        linear-gradient(180deg, #f6e2af, #deb572);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .board.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c5a2f;
      text-align: center;
      padding: 18px;
      line-height: 1.8;
      font-size: 15px;
    }

    .sticker-wrap {
      position: absolute;
      transform-origin: center center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform, left, top;
    }

    .sticker {
      display: block;
      width: 132px;
      transform-origin: center center;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.14));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .sticker-wrap.selected .sticker {
      outline: 2px dashed rgba(37,99,235,.72);
      outline-offset: 4px;
    }

    .context-menu {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      padding: 8px;
      background: rgba(17,24,39,.88);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 24px rgba(0,0,0,.22);
      z-index: 99999;
      max-width: calc(100% - 20px);
      overflow-x: auto;
      white-space: nowrap;
    }
    .context-menu.show { display: flex; }

    .menu-btn {
      flex: 0 0 auto;
      min-width: 0;
      width: auto;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }
    .menu-btn.delete { background: #ef4444; }
    .menu-btn.clear { background: #b45309; }

    .mini {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      margin-top: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .thumb {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: center;
    }
    .thumb img {
      width: 100%;
      height: 96px;
      object-fit: contain;
      display: block;
      background: transparent;
    }
    .thumb .cap {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.45;
      min-height: 32px;
      word-break: break-word;
    }
    .thumb-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .small-btn {
      height: 34px;
      border-radius: 999px;
      border: 0;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .small-btn.use { background: #eef2ff; color: #3730a3; }
    .small-btn.del { background: #111827; color: #fff; }

    @media (max-width: 380px) {
      .row, .row3 { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: 1fr 1fr; }
      .board { height: 460px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>🌌 AuroraMap</h1>
    <p>AI Sticker Studio V11.5 · 手机端本地上传 + 拍照上传 · 双击贴纸弹出操作菜单</p>
  </div>

  <div class="card">
    <h2>🏷 AI主体贴纸</h2>
    <div class="preview" id="previewBox">
      <img id="previewImage" alt="">
      <div class="placeholder">上传人物 / 建筑 / 商品 / 物品图片<br>自动识别主体并生成透明 PNG 贴纸</div>
    </div>

    <input id="fileLocal" type="file" accept="image/*">
    <input id="fileCamera" type="file" accept="image/*" capture="environment">

    <div class="row" style="margin-top:12px">
      <button id="localBtn">本地上传</button>
      <button id="cameraBtn">拍照上传</button>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="createBtn" class="secondary">✨ AI抠图生成贴纸</button>
      <button id="addBoardBtn" class="ghost">➕ 加入沙盘</button>
    </div>

    <div id="statusBox" class="status">等待图片</div>
    <div id="subjectPills" class="pills"></div>

    <div class="row" style="margin-top:12px">
      <button id="shareBtn" class="ghost">📤 分享沙盘</button>
      <button id="clearCurrentBtn" class="ghost">🧹 清空当前预览</button>
    </div>

    <div class="mini">修复重点：手机长按贴纸可任意拖动、沙盘无白底完整显示、每次生成都会自动上传到贴纸库、双击贴纸后弹出菜单栏。</div>
  </div>

  <div class="card board-card">
    <div class="board-title">🏖 贴纸沙盘</div>
    <div class="board-wrap">
      <div id="board" class="board empty">上传并生成贴纸后会自动进入贴纸库<br>点击“加入沙盘”或贴纸库中的“加入沙盘”即可使用</div>
      <div id="contextMenu" class="context-menu">
        <button class="menu-btn" data-action="front">置顶</button>
        <button class="menu-btn" data-action="up">上移一层</button>
        <button class="menu-btn" data-action="down">下移一层</button>
        <button class="menu-btn" data-action="back">置底</button>
        <button class="menu-btn delete" data-action="delete">删除选中</button>
        <button class="menu-btn clear" data-action="clear">清空</button>
      </div>
    </div>
    <div class="mini">操作方式：长按贴纸约 220ms 可拖动；双指缩放 / 旋转；双击贴纸后显示操作菜单。</div>
  </div>

  <div class="card">
    <h2>🗂 贴纸库</h2>
    <div id="gallery" class="gallery">暂无贴纸</div>
  </div>
</div>

<script>
(function(){
  const BOARD_KEY = "auroramap_board_v115";
  const LIBRARY_KEY = "auroramap_library_v115";
  const LONG_PRESS_MS = 220;
  const BASE_WIDTH = 132;
  const $ = function(id){ return document.getElementById(id); };

  var state = {
    sourceImage: "",
    cutoutDataUrl: "",
    currentMeta: null,
    boardItems: [],
    libraryItems: [],
    selectedBoardId: null,
    bgRemovalLoaded: null,
    draggingNow: false
  };

  try { state.boardItems = JSON.parse(localStorage.getItem(BOARD_KEY) || "[]"); } catch(e) { state.boardItems = []; }
  try { state.libraryItems = JSON.parse(localStorage.getItem(LIBRARY_KEY) || "[]"); } catch(e) { state.libraryItems = []; }

  var previewBox = $("previewBox");
  var previewImage = $("previewImage");
  var statusBox = $("statusBox");
  var subjectPills = $("subjectPills");
  var board = $("board");
  var gallery = $("gallery");
  var contextMenu = $("contextMenu");

  $("localBtn").addEventListener("click", function(){ $("fileLocal").click(); });
  $("cameraBtn").addEventListener("click", function(){ $("fileCamera").click(); });
  $("fileLocal").addEventListener("change", handleFileChange);
  $("fileCamera").addEventListener("change", handleFileChange);
  $("createBtn").addEventListener("click", createStickerFromSource);
  $("addBoardBtn").addEventListener("click", addCurrentToBoard);
  $("shareBtn").addEventListener("click", shareBoardImage);
  $("clearCurrentBtn").addEventListener("click", clearCurrentPreview);

  contextMenu.addEventListener("click", function(e){
    var action = e.target && e.target.dataset ? e.target.dataset.action : "";
    if(!action) return;
    if(action === "delete") deleteSelected();
    else if(action === "clear") clearBoard();
    else reorderSelected(action);
  });

  function persistBoard(){ localStorage.setItem(BOARD_KEY, JSON.stringify(state.boardItems)); }
  function persistLibrary(){ localStorage.setItem(LIBRARY_KEY, JSON.stringify(state.libraryItems)); }

  function setStatus(text){ statusBox.innerHTML = text; }

  function setPreview(src){
    if(src){
      previewBox.classList.add("show");
      previewImage.src = src;
    }else{
      previewBox.classList.remove("show");
      previewImage.removeAttribute("src");
    }
  }

  function renderSubjectPills(meta){
    if(!meta){
      subjectPills.innerHTML = "";
      return;
    }
    subjectPills.innerHTML =
      '<div class="pill">主体：' + escapeHtml(meta.subject || "未识别") + '</div>' +
      '<div class="pill">类型：' + escapeHtml(meta.type || "object") + '</div>';
  }

  async function handleFileChange(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var raw = await fileToDataURL(file);
    state.sourceImage = await compressDataUrl(raw, 1400, 0.86);
    state.cutoutDataUrl = "";
    state.currentMeta = null;
    renderSubjectPills(null);
    setPreview(state.sourceImage);
    setStatus("图片已上传，点击“AI抠图生成贴纸”开始处理。");
    e.target.value = "";
  }

  function clearCurrentPreview(){
    state.sourceImage = "";
    state.cutoutDataUrl = "";
    state.currentMeta = null;
    setPreview("");
    renderSubjectPills(null);
    setStatus("已清空当前预览。");
  }

  async function createStickerFromSource(){
    if(!state.sourceImage){
      alert("请先上传图片");
      return;
    }
    try{
      setStatus("1/3 正在快速识别主体类型...");
      var fastInput = await compressDataUrl(state.sourceImage, 720, 0.72);
      var meta = await identifySubject(fastInput);
      state.currentMeta = meta;
      renderSubjectPills(meta);

      setStatus("2/3 正在加载 AI 抠图引擎...");
      var removeBackground = await loadBackgroundRemoval();

      setStatus("3/3 正在生成透明 PNG 与 6pt 粗不规则白边贴纸...");
      var cutoutBlob = await removeBackground(dataUrlToBlob(state.sourceImage), { progress: function(){} });
      var stickerBlob = await buildTrueStickerBlob(cutoutBlob);
      state.cutoutDataUrl = await blobToDataURL(stickerBlob);

      setPreview(state.cutoutDataUrl);
      autoAddToLibrary();
      renderGallery();
      setStatus("✅ 贴纸生成完成，已自动加入贴纸库。");
    }catch(err){
      console.error(err);
      setStatus("❌ 生成失败：" + (err && err.message ? err.message : err));
      alert("贴纸生成失败，请稍后重试。\n" + (err && err.message ? err.message : err));
    }
  }

  function autoAddToLibrary(){
    if(!state.cutoutDataUrl) return;
    var item = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      src: state.cutoutDataUrl,
      subject: state.currentMeta && state.currentMeta.subject ? state.currentMeta.subject : "未知主体",
      type: state.currentMeta && state.currentMeta.type ? state.currentMeta.type : "object",
      createdAt: new Date().toLocaleString()
    };
    state.libraryItems.unshift(item);
    if(state.libraryItems.length > 120) state.libraryItems.length = 120;
    persistLibrary();
  }

  async function identifySubject(imageDataUrl){
    try{
      var res = await fetch("/api/sticker", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ image: imageDataUrl })
      });
      var data = await res.json();
      return data && !data.error ? data : { subject: "未知主体", type: "object" };
    }catch(e){
      return { subject: "未知主体", type: "object" };
    }
  }

  async function loadBackgroundRemoval(){
    if(state.bgRemovalLoaded) return state.bgRemovalLoaded;
    var urls = [
      "https://esm.sh/@imgly/background-removal?bundle",
      "https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm"
    ];
    var lastErr = null;
    for(var i=0;i<urls.length;i++){
      try{
        var mod = await import(urls[i]);
        if(mod && mod.removeBackground){
          state.bgRemovalLoaded = mod.removeBackground;
          return mod.removeBackground;
        }
      }catch(err){
        lastErr = err;
      }
    }
    throw lastErr || new Error("背景移除引擎加载失败");
  }

  async function buildTrueStickerBlob(inputBlob){
    var bmp = await createImageBitmap(inputBlob);
    var w = bmp.width, h = bmp.height;

    var srcCanvas = document.createElement("canvas");
    srcCanvas.width = w;
    srcCanvas.height = h;
    var sctx = srcCanvas.getContext("2d");
    sctx.drawImage(bmp, 0, 0);

    var border = 46; // 6pt 粗白边视觉
    var pad = border * 4;

    var maskCanvas = document.createElement("canvas");
    maskCanvas.width = w;
    maskCanvas.height = h;
    var mctx = maskCanvas.getContext("2d");
    mctx.drawImage(srcCanvas, 0, 0);

    var imgData = mctx.getImageData(0, 0, w, h);
    for(var p=0; p<imgData.data.length; p+=4){
      var a = imgData.data[p+3];
      imgData.data[p] = 255;
      imgData.data[p+1] = 255;
      imgData.data[p+2] = 255;
      imgData.data[p+3] = a;
    }
    mctx.putImageData(imgData, 0, 0);

    var outCanvas = document.createElement("canvas");
    outCanvas.width = w + pad * 2;
    outCanvas.height = h + pad * 2;
    var ctx = outCanvas.getContext("2d");
    var ox = pad, oy = pad;

    for(var ang = 0; ang < 360; ang += 6){
      var rad = ang * Math.PI / 180;
      for(var r = 4; r <= border; r += 5){
        var dx = Math.round(Math.cos(rad) * r);
        var dy = Math.round(Math.sin(rad) * r);
        ctx.drawImage(maskCanvas, ox + dx, oy + dy);
      }
    }

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.14)";
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 7;
    ctx.drawImage(srcCanvas, ox, oy);
    ctx.restore();

    ctx.drawImage(srcCanvas, ox, oy);

    return await new Promise(function(resolve){
      outCanvas.toBlob(resolve, "image/png");
    });
  }

  function addCurrentToBoard(){
    if(!state.cutoutDataUrl){
      alert("请先生成贴纸");
      return;
    }
    addSrcToBoard(state.cutoutDataUrl, state.currentMeta && state.currentMeta.subject ? state.currentMeta.subject : "未知主体", state.currentMeta && state.currentMeta.type ? state.currentMeta.type : "object");
  }

  function addLibraryToBoard(id){
    var lib = state.libraryItems.find(function(x){ return x.id === id; });
    if(!lib) return;
    addSrcToBoard(lib.src, lib.subject || "未知主体", lib.type || "object");
  }

  function addSrcToBoard(src, subject, type){
    var item = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      src: src,
      x: 100 + (state.boardItems.length % 5) * 18,
      y: 90 + (state.boardItems.length % 5) * 18,
      scale: 1,
      rotation: 0,
      z: state.boardItems.length,
      subject: subject,
      type: type
    };
    state.boardItems.push(item);
    state.selectedBoardId = item.id;
    persistBoard();
    renderBoard();
  }

  function deleteLibraryItem(id){
    state.libraryItems = state.libraryItems.filter(function(x){ return x.id !== id; });
    persistLibrary();
    renderGallery();
  }

  function showMenu(){ contextMenu.classList.add("show"); }
  function hideMenu(){ contextMenu.classList.remove("show"); }

  function renderBoard(){
    board.innerHTML = "";
    board.appendChild(contextMenu);

    if(!state.boardItems.length){
      board.classList.add("empty");
      board.innerHTML = '上传并生成贴纸后会自动进入贴纸库<br>点击“加入沙盘”或贴纸库中的“加入沙盘”即可使用';
      board.appendChild(contextMenu);
      hideMenu();
      return;
    }

    board.classList.remove("empty");
    var sorted = state.boardItems.slice().sort(function(a,b){ return (a.z || 0) - (b.z || 0); });

    for(var i=0;i<sorted.length;i++){
      (function(item){
        var wrap = document.createElement("div");
        wrap.className = "sticker-wrap";
        wrap.dataset.id = item.id;
        applyItemTransform(wrap, item);

        var img = document.createElement("img");
        img.src = item.src;
        img.className = "sticker";
        img.draggable = false;
        wrap.appendChild(img);

        attachGesture(wrap, item);
        board.appendChild(wrap);
      })(sorted[i]);
    }

    updateSelectionVisuals();
  }

  function updateSelectionVisuals(){
    var wraps = board.querySelectorAll(".sticker-wrap");
    wraps.forEach(function(w){
      var id = Number(w.dataset.id);
      if(id === state.selectedBoardId) w.classList.add("selected");
      else w.classList.remove("selected");
    });
  }

  function applyItemTransform(el, item){
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
    el.style.transform = "translate(-50%,-50%) rotate(" + item.rotation + "deg) scale(" + item.scale + ")";
    el.style.zIndex = item.z;
  }

  function attachGesture(el, item){
    var pressTimer = null;
    var dragging = false;
    var moved = false;
    var gesture = null;
    var startX = 0, startY = 0, startItemX = 0, startItemY = 0;
    var lastTapTime = 0;
    var rafToken = 0;
    var moveCache = null;

    function scheduleMove(x, y, scale, rotation){
      moveCache = { x: x, y: y, scale: scale, rotation: rotation };
      if(rafToken) return;
      rafToken = requestAnimationFrame(function(){
        rafToken = 0;
        if(!moveCache) return;
        item.x = moveCache.x;
        item.y = moveCache.y;
        item.scale = moveCache.scale;
        item.rotation = moveCache.rotation;
        applyItemTransform(el, item);
        moveCache = null;
      });
    }

    function clearPress(){
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }

    function beginSingle(clientX, clientY){
      startX = clientX;
      startY = clientY;
      startItemX = item.x;
      startItemY = item.y;
      dragging = false;
      moved = false;
      clearPress();
      pressTimer = setTimeout(function(){
        dragging = true;
        state.draggingNow = true;
        document.body.style.overflow = "hidden";
      }, LONG_PRESS_MS);
    }

    function endDrag(){
      clearPress();
      if(dragging){
        dragging = false;
        state.draggingNow = false;
        document.body.style.overflow = "";
      }
      gesture = null;
      persistBoard();
    }

    function handleTap(){
      var now = Date.now();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();
      if(now - lastTapTime < 320){
        showMenu();
      }else{
        hideMenu();
      }
      lastTapTime = now;
    }

    el.addEventListener("click", function(e){
      e.stopPropagation();
      if(moved || state.draggingNow) return;
      handleTap();
    });

    el.addEventListener("touchstart", function(e){
      e.stopPropagation();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();

      if(e.touches.length === 1){
        var t = e.touches[0];
        beginSingle(t.clientX, t.clientY);
      }else if(e.touches.length === 2){
        clearPress();
        dragging = false;
        moved = true;
        var t1 = e.touches[0], t2 = e.touches[1];
        gesture = {
          startScale: item.scale,
          startRotation: item.rotation,
          startX: item.x,
          startY: item.y,
          startDist: distance(t1, t2),
          startAngle: angleDeg(t1, t2),
          startCenter: centerPt(t1, t2)
        };
      }
    }, { passive: true });

    el.addEventListener("touchmove", function(e){
      if(e.touches.length === 1){
        var t = e.touches[0];
        var dx = t.clientX - startX;
        var dy = t.clientY - startY;
        if(Math.hypot(dx, dy) > 8) moved = true;

        if(dragging){
          e.preventDefault();
          scheduleMove(startItemX + dx, startItemY + dy, item.scale, item.rotation);
        }else if(moved){
          clearPress();
        }
      }else if(e.touches.length >= 2 && gesture){
        e.preventDefault();
        clearPress();
        moved = true;
        var a = e.touches[0], b = e.touches[1];
        var newDist = distance(a, b);
        var newAngle = angleDeg(a, b);
        var c = centerPt(a, b);
        var nextScale = Math.max(0.35, Math.min(3.2, gesture.startScale * (newDist / gesture.startDist)));
        var nextRotation = gesture.startRotation + (newAngle - gesture.startAngle);
        var nextX = gesture.startX + (c.x - gesture.startCenter.x);
        var nextY = gesture.startY + (c.y - gesture.startCenter.y);
        scheduleMove(nextX, nextY, nextScale, nextRotation);
      }
    }, { passive: false });

    el.addEventListener("touchend", function(){
      setTimeout(function(){ moved = false; }, 0);
      endDrag();
    });

    el.addEventListener("touchcancel", function(){
      moved = false;
      endDrag();
    });

    // mouse fallback
    var mouseDown = false;
    el.addEventListener("mousedown", function(e){
      e.preventDefault();
      e.stopPropagation();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();
      mouseDown = true;
      beginSingle(e.clientX, e.clientY);
    });

    window.addEventListener("mousemove", function(e){
      if(!mouseDown) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if(Math.hypot(dx, dy) > 5) moved = true;
      if(dragging){
        scheduleMove(startItemX + dx, startItemY + dy, item.scale, item.rotation);
      }else if(moved){
        clearPress();
      }
    });

    window.addEventListener("mouseup", function(){
      if(mouseDown){
        mouseDown = false;
        moved = false;
        endDrag();
      }
    });
  }

  board.addEventListener("click", function(e){
    if(e.target === board){
      state.selectedBoardId = null;
      hideMenu();
      updateSelectionVisuals();
    }
  });

  function distance(a,b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function angleDeg(a,b){ return Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) * 180 / Math.PI; }
  function centerPt(a,b){ return { x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2 }; }

  function reorderSelected(mode){
    if(state.selectedBoardId == null){
      alert("请先选中一个贴纸");
      return;
    }
    var sorted = state.boardItems.slice().sort(function(a,b){ return a.z - b.z; });
    var cur = sorted.findIndex(function(x){ return x.id === state.selectedBoardId; });
    if(cur < 0) return;

    if(mode === "front" && cur < sorted.length - 1){
      var frontItem = sorted.splice(cur, 1)[0];
      sorted.push(frontItem);
    }else if(mode === "back" && cur > 0){
      var backItem = sorted.splice(cur, 1)[0];
      sorted.unshift(backItem);
    }else if(mode === "up" && cur < sorted.length - 1){
      var tmpUp = sorted[cur];
      sorted[cur] = sorted[cur + 1];
      sorted[cur + 1] = tmpUp;
    }else if(mode === "down" && cur > 0){
      var tmpDown = sorted[cur];
      sorted[cur] = sorted[cur - 1];
      sorted[cur - 1] = tmpDown;
    }

    sorted.forEach(function(it, i){ it.z = i; });
    state.boardItems = sorted;
    persistBoard();
    renderBoard();
  }

  function deleteSelected(){
    if(state.selectedBoardId == null){
      alert("请先选中一个贴纸");
      return;
    }
    state.boardItems = state.boardItems.filter(function(x){ return x.id !== state.selectedBoardId; });
    state.selectedBoardId = null;
    persistBoard();
    hideMenu();
    renderBoard();
  }

  function clearBoard(){
    if(!state.boardItems.length) return;
    if(confirm("确定清空沙盘中的所有贴纸吗？")){
      state.boardItems = [];
      state.selectedBoardId = null;
      persistBoard();
      hideMenu();
      renderBoard();
    }
  }

  function renderGallery(){
    if(!state.libraryItems.length){
      gallery.innerHTML = "暂无贴纸";
      return;
    }

    gallery.innerHTML = state.libraryItems.map(function(item){
      return (
        '<div class="thumb">' +
          '<img loading="lazy" decoding="async" src="' + item.src + '" alt="">' +
          '<div class="cap">' + escapeHtml(item.subject || "未知主体") + '<br>' + escapeHtml(item.createdAt || "") + '</div>' +
          '<div class="thumb-actions">' +
            '<button class="small-btn use" data-use="' + item.id + '">加入沙盘</button>' +
            '<button class="small-btn del" data-del="' + item.id + '">删除</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    gallery.querySelectorAll("[data-use]").forEach(function(btn){
      btn.addEventListener("click", function(){ addLibraryToBoard(Number(btn.dataset.use)); });
    });
    gallery.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteLibraryItem(Number(btn.dataset.del)); });
    });
  }

  async function shareBoardImage(){
    if(!state.boardItems.length){
      alert("沙盘还没有贴纸");
      return;
    }
    try{
      var blob = await exportBoardToBlob();
      var file = new File([blob], "auroramap-board.png", { type: "image/png" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({
          title: "AuroraMap 沙盘贴纸",
          text: "这是我制作的 AuroraMap 贴纸沙盘",
          files: [file]
        });
      }else{
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "auroramap-board.png";
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      }
    }catch(err){
      alert("分享失败：" + (err && err.message ? err.message : err));
    }
  }

  async function exportBoardToBlob(){
    var rect = board.getBoundingClientRect();
    var canvas = document.createElement("canvas");
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    var ctx = canvas.getContext("2d");
    ctx.scale(2, 2);

    var grad = ctx.createLinearGradient(0,0,0,rect.height);
    grad.addColorStop(0, "#f6e2af");
    grad.addColorStop(1, "#deb572");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,rect.width,rect.height);

    ctx.fillStyle = "rgba(255,255,255,.28)";
    for(var y=16;y<rect.height;y+=34){
      for(var x=16;x<rect.width;x+=34){
        ctx.beginPath();
        ctx.arc(x,y,2,0,Math.PI*2);
        ctx.fill();
      }
    }

    var sorted = state.boardItems.slice().sort(function(a,b){ return (a.z || 0) - (b.z || 0); });
    for(var i=0;i<sorted.length;i++){
      var item = sorted[i];
      var img = await loadImage(item.src);
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rotation * Math.PI / 180);
      ctx.scale(item.scale, item.scale);
      var width = BASE_WIDTH;
      var height = img.height / img.width * width;
      ctx.drawImage(img, -width/2, -height/2, width, height);
      ctx.restore();
    }

    return await new Promise(function(resolve){
      canvas.toBlob(resolve, "image/png");
    });
  }

  async function compressDataUrl(dataUrl, maxSide, quality){
    var img = await loadImage(dataUrl);
    var ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width * ratio));
    var h = Math.max(1, Math.round(img.height * ratio));
    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function fileToDataURL(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){ resolve(e.target.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function blobToDataURL(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){ resolve(e.target.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function dataUrlToBlob(dataUrl){
    var arr = dataUrl.split(",");
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8arr = new Uint8Array(n);
    while(n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  }

  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(s){
      return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[s];
    });
  }

  renderBoard();
  renderGallery();
})();
</script>
