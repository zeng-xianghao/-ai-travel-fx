<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI旅行汇率助手</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
linear-gradient(
135deg,
#dbeafe,
#f5f3ff
);

font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei";

}


.app{

max-width:430px;

margin:auto;

padding:25px;

}



.logo{

font-size:30px;

font-weight:700;

margin-bottom:20px;

}



.glass{

background:
rgba(255,255,255,.65);

backdrop-filter:
blur(20px);

border-radius:30px;

padding:25px;

margin-bottom:20px;

box-shadow:
0 20px 50px rgba(0,0,0,.1);

}



.upload{

height:220px;

border-radius:25px;

border:2px dashed #93c5fd;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:#fff;

}



.upload img{

width:100%;

height:100%;

object-fit:cover;

}



input{

display:none;

}



.bigbtn{

width:100%;

height:55px;

border:none;

border-radius:30px;

margin-top:20px;

background:
linear-gradient(
135deg,
#2563eb,
#4f46e5
);

color:white;

font-size:18px;

font-weight:bold;

}



.card{

background:white;

border-radius:25px;

padding:20px;

margin-top:15px;

}



.flag{

font-size:50px;

}



.price{

font-size:30px;

font-weight:bold;

color:#2563eb;

}



.rmb{

font-size:34px;

font-weight:bold;

color:#16a34a;

}



.loading{

text-align:center;

color:#2563eb;

}



.small{

color:#64748b;

font-size:14px;

}



</style>

</head>


<body>


<div class="app">


<div class="logo">

🌍 AI旅行汇率助手

</div>



<div class="glass">


<label class="upload">


<img id="preview">


</label>


<input

id="file"

type="file"

accept="image/*"

capture="environment">



<button

class="bigbtn"

onclick="runAI()">

📷 AI智能识别价格

</button>



</div>




<div class="glass">


<div id="result">

<div class="small">

等待拍摄商品、小票或菜单

</div>

</div>



<button

class="bigbtn"

onclick="speak()">

🔊 播报结果

</button>



</div>



</div>





<script>


let imageBase64="";

let speech="";



const fileInput=
document.getElementById("file");

const preview=
document.getElementById("preview");

const result=
document.getElementById("result");



/*

上传图片

*/

fileInput.onclick=function(){

}



fileInput.onchange=function(e){


let file=e.target.files[0];


if(!file)return;



let reader=new FileReader();



reader.onload=function(){

let img=new Image();


img.onload=function(){


let canvas=
document.createElement("canvas");


let max=1000;


let scale=
max/img.width;


canvas.width=max;


canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");


ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);



imageBase64=
canvas.toDataURL(
"image/jpeg",
0.7
);



preview.src=imageBase64;


}


img.src=reader.result;


}


reader.readAsDataURL(file);


}




async function runAI(){


if(!imageBase64){

alert("请先拍照");

return;

}



result.innerHTML=

`

<div class="loading">

🤖 AI正在识别...

<br>

请等待

</div>

`;



try{


let res=

await fetch(
"/api/vision",
{


method:"POST",


headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

image:imageBase64

})


});



let data=
await res.json();



if(data.error){

throw new Error(data.error);

}



let flag="🌍";



const flags={

China:"🇨🇳",

Japan:"🇯🇵",

USA:"🇺🇸",

"United States":"🇺🇸",

Korea:"🇰🇷",

France:"🇫🇷",

Germany:"🇩🇪"

};



if(flags[data.country])

flag=flags[data.country];



speech=

`${data.amount}${data.currency}，约${data.cny}人民币`;



result.innerHTML=

`

<div class="card">

<div class="flag">

${flag}

</div>


<h3>

${data.country || "未知国家"}

</h3>


<div>

货币：

${data.currency}

</div>


<div class="price">

${data.symbol || ""}${data.amount}

</div>


<hr>


<div>

人民币

</div>


<div class="rmb">

¥${data.cny || "--"}

</div>


</div>

`;



}

catch(e){


result.innerHTML=

`

❌ 识别失败

<br><br>

${e.message}

`;

}


}



function speak(){


if(!speech){

alert("暂无结果");

return;

}


let u=
new SpeechSynthesisUtterance(
speech
);


u.lang="zh-CN";


speechSynthesis.speak(u);


}


</script>


</body>

</html>
