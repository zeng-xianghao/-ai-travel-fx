<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>AuroraMap AI Sticker Studio</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      color: #111827;
    }
    body { padding-bottom: env(safe-area-inset-bottom); }
    .app { max-width: 430px; margin: 0 auto; padding: 16px 14px 96px; }
    .hero { margin: 8px 0 16px; }
    .hero h1 { margin: 0; font-size: 30px; font-weight: 900; }
    .hero p { margin: 6px 0 0; color: #64748b; font-size: 13px; }

    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      margin-bottom: 14px;
    }

    h2 { margin: 0 0 12px; font-size: 18px; font-weight: 900; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview {
      height: 220px;
      border: 2px dashed #93c5fd;
      border-radius: 22px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      text-align: center;
      color: #64748b;
    }
    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .preview.show img { display: block; }
    .preview.show .placeholder { display: none; }
    .placeholder { padding: 16px; line-height: 1.8; font-size: 14px; }
    input[type=file] { display: none; }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary { background: #111827; }
    button.ghost { background: #eef2ff; color: #3730a3; }

    .status {
      background: #eff6ff;
      border-radius: 18px;
      padding: 12px 14px;
      color: #1d4ed8;
      font-size: 14px;
      line-height: 1.7;
      min-height: 72px;
      margin-top: 12px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #111827;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .board-wrap {
      position: relative;
      background: linear-gradient(180deg, #fff7e8, #efd09b);
      border-radius: 28px;
      padding: 12px;
      box-shadow: inset 0 0 0 8px rgba(255,255,255,.18), inset 0 0 24px rgba(141,96,36,.16);
    }
    .board {
      height: 420px;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 16px 16px, rgba(255,255,255,.3) 0 2px, transparent 3px) 0 0/34px 34px,
        linear-gradient(180deg, #f6e2af, #deb572);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .board.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c5a2f;
      text-align: center;
      padding: 18px;
      line-height: 1.8;
    }

    .sticker-wrap {
      position: absolute;
      transform-origin: center center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform, left, top;
    }
    .sticker {
      display: block;
      width: 128px;
      transform-origin: center center;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.15));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .sticker-wrap.selected .sticker {
      outline: 2px dashed rgba(37,99,235,.72);
      outline-offset: 4px;
    }

    .context-menu {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: none;
      gap: 8px;
      padding: 8px;
      background: rgba(17,24,39,.88);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 24px rgba(0,0,0,.22);
      z-index: 99999;
      max-width: calc(100% - 16px);
      overflow-x: auto;
      white-space: nowrap;
    }
    .context-menu.show { display: flex; }
    .menu-btn {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      width: auto;
      min-width: 0;
    }
    .menu-btn.delete { background: #ef4444; }

    .mini {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      margin-top: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .thumb {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: center;
    }
    .thumb img {
      width: 100%;
      height: 96px;
      object-fit: contain;
      display: block;
    }
    .thumb .cap {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      min-height: 32px;
      word-break: break-word;
    }
    .thumb-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .small-btn {
      height: 34px;
      border-radius: 999px;
      border: 0;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .small-btn.use { background: #eef2ff; color: #3730a3; }
    .small-btn.del { background: #111827; color: #fff; }

    @media (max-width: 380px) {
      .row { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>🌌 AuroraMap</h1>
    <p>AI Sticker Studio · 真正透明 PNG 抠图贴纸 · 手机 / 微信浏览器流畅优化版</p>
  </div>

  <div class="card">
    <h2>🏷 AI主体贴纸</h2>
    <div class="preview" id="previewBox">
      <img id="previewImage" alt="">
      <div class="placeholder">上传人物 / 建筑 / 商品 / 物品图片<br>自动识别主体并生成透明 PNG 贴纸</div>
    </div>
    <input id="fileInput" type="file" accept="image/*" capture="environment">
    <div class="row" style="margin-top:12px">
      <button id="uploadBtn">上传图片</button>
      <button id="createBtn" class="secondary">✨ AI抠图生成贴纸</button>
    </div>
    <div id="statusBox" class="status">等待图片</div>
    <div id="subjectPills" class="pills"></div>
    <div class="row" style="margin-top:12px">
      <button id="addBoardBtn" class="ghost">➕ 加入沙盘</button>
      <button id="shareBtn" class="ghost">📤 分享沙盘</button>
    </div>
    <div class="mini">优化：长按任意拖动、白边 6pt、更流畅的沙盘渲染、生成后自动加入贴纸库、双击贴纸显示操作菜单。</div>
  </div>

  <div class="card">
    <h2>🏖 贴纸沙盘</h2>
    <div class="board-wrap">
      <div id="board" class="board empty">上传并生成贴纸后会自动进入贴纸库<br>点击“加入沙盘”或贴纸库中的“加入沙盘”即可使用</div>
      <div id="contextMenu" class="context-menu">
        <button class="menu-btn" data-action="front">置顶</button>
        <button class="menu-btn" data-action="up">上移一层</button>
        <button class="menu-btn" data-action="down">下移一层</button>
        <button class="menu-btn" data-action="back">置底</button>
        <button class="menu-btn delete" data-action="delete">删除</button>
      </div>
    </div>
    <div class="mini">操作：长按贴纸约 220ms 即可任意拖动；双指缩放与旋转；双击贴纸弹出菜单。</div>
  </div>

  <div class="card">
    <h2>🗂 贴纸库</h2>
    <div id="gallery" class="gallery">暂无贴纸</div>
  </div>
</div>

<script>
(function(){
  const BOARD_KEY = "auroramap_board_v114";
  const LIBRARY_KEY = "auroramap_library_v114";
  const LONG_PRESS_MS = 220;
  const BASE_WIDTH = 128;
  const $ = (id) => document.getElementById(id);

  const state = {
    sourceImage: "",
    cutoutDataUrl: "",
    currentMeta: null,
    boardItems: [],
    libraryItems: [],
    selectedBoardId: null,
    bgRemovalLoaded: null
  };

  try { state.boardItems = JSON.parse(localStorage.getItem(BOARD_KEY) || "[]"); } catch(e) { state.boardItems = []; }
  try { state.libraryItems = JSON.parse(localStorage.getItem(LIBRARY_KEY) || "[]"); } catch(e) { state.libraryItems = []; }

  const previewBox = $("previewBox");
  const previewImage = $("previewImage");
  const statusBox = $("statusBox");
  const subjectPills = $("subjectPills");
  const board = $("board");
  const gallery = $("gallery");
  const contextMenu = $("contextMenu");

  $("uploadBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", handleFileChange);
  $("createBtn").addEventListener("click", createStickerFromSource);
  $("addBoardBtn").addEventListener("click", addCurrentToBoard);
  $("shareBtn").addEventListener("click", shareBoardImage);

  contextMenu.addEventListener("click", (e) => {
    const action = e.target?.dataset?.action;
    if(!action) return;
    if(action === "delete") deleteSelected();
    else reorderSelected(action);
  });

  function persistBoard(){ localStorage.setItem(BOARD_KEY, JSON.stringify(state.boardItems)); }
  function persistLibrary(){ localStorage.setItem(LIBRARY_KEY, JSON.stringify(state.libraryItems)); }
  function setStatus(text){ statusBox.innerHTML = text; }

  function setPreview(src){
    if(src){
      previewBox.classList.add("show");
      previewImage.src = src;
    }else{
      previewBox.classList.remove("show");
      previewImage.removeAttribute("src");
    }
  }

  function renderSubjectPills(meta){
    if(!meta){ subjectPills.innerHTML = ""; return; }
    subjectPills.innerHTML = `
      <div class="pill">主体：${meta.subject || "未识别"}</div>
      <div class="pill">类型：${meta.type || "object"}</div>
    `;
  }

  async function handleFileChange(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const raw = await fileToDataURL(file);
    state.sourceImage = await compressDataUrl(raw, 1400, 0.86);
    state.cutoutDataUrl = "";
    state.currentMeta = null;
    renderSubjectPills(null);
    setPreview(state.sourceImage);
    setStatus("图片已上传，点击“AI抠图生成贴纸”开始处理。");
  }

  async function createStickerFromSource(){
    if(!state.sourceImage){
      alert("请先上传图片");
      return;
    }
    try{
      setStatus("1/3 正在快速识别主体类型...");
      const fastInput = await compressDataUrl(state.sourceImage, 720, 0.72);
      const meta = await identifySubject(fastInput);
      state.currentMeta = meta;
      renderSubjectPills(meta);

      setStatus("2/3 正在加载 AI 抠图引擎...");
      const removeBackground = await loadBackgroundRemoval();

      setStatus("3/3 正在生成透明 PNG 与 6pt 粗不规则白边贴纸...");
      const cutoutBlob = await removeBackground(dataUrlToBlob(state.sourceImage), { progress: () => {} });
      const stickerBlob = await buildTrueStickerBlob(cutoutBlob);
      state.cutoutDataUrl = await blobToDataURL(stickerBlob);

      setPreview(state.cutoutDataUrl);
      setStatus("✅ 贴纸生成完成，已自动加入贴纸库。");

      autoAddToLibrary();
      renderGallery();
    }catch(err){
      console.error(err);
      setStatus("❌ 生成失败：" + (err.message || err));
      alert("贴纸生成失败，请稍后重试。\n" + (err.message || err));
    }
  }

  function autoAddToLibrary(){
    if(!state.cutoutDataUrl) return;
    const item = {
      id: Date.now(),
      src: state.cutoutDataUrl,
      subject: state.currentMeta?.subject || "未知主体",
      type: state.currentMeta?.type || "object",
      createdAt: new Date().toLocaleString()
    };
    state.libraryItems.unshift(item);
    if(state.libraryItems.length > 100) state.libraryItems.length = 100;
    persistLibrary();
  }

  async function identifySubject(imageDataUrl){
    try{
      const res = await fetch("/api/sticker", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ image: imageDataUrl })
      });
      const data = await res.json();
      return data && !data.error ? data : { subject:"未知主体", type:"object" };
    }catch(e){
      return { subject:"未知主体", type:"object" };
    }
  }

  async function loadBackgroundRemoval(){
    if(state.bgRemovalLoaded) return state.bgRemovalLoaded;
    const urls = [
      "https://esm.sh/@imgly/background-removal?bundle",
      "https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm"
    ];
    let lastErr = null;
    for(const url of urls){
      try{
        const mod = await import(url);
        if(mod && mod.removeBackground){
          state.bgRemovalLoaded = mod.removeBackground;
          return mod.removeBackground;
        }
      }catch(err){ lastErr = err; }
    }
    throw lastErr || new Error("背景移除引擎加载失败");
  }

  async function buildTrueStickerBlob(inputBlob){
    const bmp = await createImageBitmap(inputBlob);
    const w = bmp.width, h = bmp.height;

    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = w;
    srcCanvas.height = h;
    const sctx = srcCanvas.getContext("2d");
    sctx.drawImage(bmp, 0, 0);

    const border = 52; // ~6pt 粗白边
    const pad = border * 4;

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = w;
    maskCanvas.height = h;
    const mctx = maskCanvas.getContext("2d");
    mctx.drawImage(srcCanvas, 0, 0);

    const imgData = mctx.getImageData(0, 0, w, h);
    for(let i=0; i<imgData.data.length; i+=4){
      const a = imgData.data[i+3];
      imgData.data[i] = 255;
      imgData.data[i+1] = 255;
      imgData.data[i+2] = 255;
      imgData.data[i+3] = a;
    }
    mctx.putImageData(imgData, 0, 0);

    const outCanvas = document.createElement("canvas");
    outCanvas.width = w + pad * 2;
    outCanvas.height = h + pad * 2;
    const ctx = outCanvas.getContext("2d");
    const ox = pad, oy = pad;

    for(let ang = 0; ang < 360; ang += 6){
      const rad = ang * Math.PI / 180;
      for(let r = 4; r <= border; r += 5){
        const dx = Math.round(Math.cos(rad) * r);
        const dy = Math.round(Math.sin(rad) * r);
        ctx.drawImage(maskCanvas, ox + dx, oy + dy);
      }
    }

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.14)";
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 7;
    ctx.drawImage(srcCanvas, ox, oy);
    ctx.restore();

    ctx.drawImage(srcCanvas, ox, oy);

    return await new Promise(resolve => outCanvas.toBlob(resolve, "image/png"));
  }

  function addCurrentToBoard(){
    if(!state.cutoutDataUrl){
      alert("请先生成贴纸");
      return;
    }
    const item = {
      id: Date.now(),
      src: state.cutoutDataUrl,
      x: 100 + (state.boardItems.length % 5) * 18,
      y: 90 + (state.boardItems.length % 5) * 18,
      scale: 1,
      rotation: 0,
      z: state.boardItems.length,
      subject: state.currentMeta?.subject || "未知主体",
      type: state.currentMeta?.type || "object"
    };
    state.boardItems.push(item);
    state.selectedBoardId = item.id;
    persistBoard();
    renderBoard();
  }

  function addLibraryToBoard(id){
    const lib = state.libraryItems.find(x => x.id === id);
    if(!lib) return;
    const item = {
      id: Date.now(),
      src: lib.src,
      x: 100 + (state.boardItems.length % 5) * 18,
      y: 90 + (state.boardItems.length % 5) * 18,
      scale: 1,
      rotation: 0,
      z: state.boardItems.length,
      subject: lib.subject,
      type: lib.type
    };
    state.boardItems.push(item);
    state.selectedBoardId = item.id;
    persistBoard();
    renderBoard();
  }

  function deleteLibraryItem(id){
    state.libraryItems = state.libraryItems.filter(x => x.id !== id);
    persistLibrary();
    renderGallery();
  }

  function showMenu(){ contextMenu.classList.add("show"); }
  function hideMenu(){ contextMenu.classList.remove("show"); }

  function renderBoard(){
    board.innerHTML = "";
    board.appendChild(contextMenu);

    if(!state.boardItems.length){
      board.classList.add("empty");
      board.innerHTML = '上传并生成贴纸后会自动进入贴纸库<br>点击“加入沙盘”或贴纸库中的“加入沙盘”即可使用';
      board.appendChild(contextMenu);
      hideMenu();
      return;
    }

    board.classList.remove("empty");
    const sorted = [...state.boardItems].sort((a,b) => (a.z||0) - (b.z||0));

    sorted.forEach(item => {
      const wrap = document.createElement("div");
      wrap.className = "sticker-wrap";
      wrap.dataset.id = item.id;
      applyItemTransform(wrap, item);

      const img = document.createElement("img");
      img.src = item.src;
      img.className = "sticker";
      wrap.appendChild(img);

      attachGesture(wrap, item);
      board.appendChild(wrap);
    });

    updateSelectionVisuals();
  }

  function updateSelectionVisuals(){
    const wraps = board.querySelectorAll(".sticker-wrap");
    wraps.forEach(w => {
      const id = Number(w.dataset.id);
      w.classList.toggle("selected", id === state.selectedBoardId);
    });
  }

  function applyItemTransform(el, item){
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
    el.style.transform = `translate(-50%,-50%) rotate(${item.rotation}deg) scale(${item.scale})`;
    el.style.zIndex = item.z;
  }

  function attachGesture(el, item){
    let pressTimer = null;
    let dragging = false;
    let startX = 0, startY = 0, startItemX = 0, startItemY = 0;
    let gesture = null;
    let lastTapTime = 0;
    let rafId = 0;
    let pendingMove = null;

    function scheduleTransform(x, y, scale, rotation){
      pendingMove = { x, y, scale, rotation };
      if(rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = 0;
        if(!pendingMove) return;
        item.x = pendingMove.x;
        item.y = pendingMove.y;
        item.scale = pendingMove.scale;
        item.rotation = pendingMove.rotation;
        applyItemTransform(el, item);
        pendingMove = null;
      });
    }

    function clearPress(){
      if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }

    function onSinglePointStart(clientX, clientY){
      startX = clientX;
      startY = clientY;
      startItemX = item.x;
      startItemY = item.y;
      dragging = false;
      clearPress();
      pressTimer = setTimeout(() => { dragging = true; }, LONG_PRESS_MS);
    }

    function onTap(){
      const now = Date.now();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();

      if(now - lastTapTime < 300){
        showMenu();
      }else{
        hideMenu();
      }
      lastTapTime = now;
    }

    el.addEventListener("click", (e) => {
      e.stopPropagation();
      onTap();
    });

    // touch
    el.addEventListener("touchstart", (e) => {
      e.stopPropagation();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();

      if(e.touches.length === 1){
        const t = e.touches[0];
        onSinglePointStart(t.clientX, t.clientY);
      } else if(e.touches.length === 2){
        clearPress();
        dragging = false;
        const t1 = e.touches[0], t2 = e.touches[1];
        gesture = {
          startScale: item.scale,
          startRotation: item.rotation,
          startX: item.x,
          startY: item.y,
          startDist: distance(t1, t2),
          startAngle: angleDeg(t1, t2),
          startCenter: centerPt(t1, t2)
        };
      }
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      if(e.touches.length === 1){
        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if(dragging){
          e.preventDefault();
          scheduleTransform(startItemX + dx, startItemY + dy, item.scale, item.rotation);
        } else {
          const movedFar = Math.hypot(dx, dy) > 10;
          if(movedFar) clearPress();
        }
      } else if(e.touches.length >= 2 && gesture){
        e.preventDefault();
        clearPress();
        const t1 = e.touches[0], t2 = e.touches[1];
        const newDist = distance(t1, t2);
        const newAngle = angleDeg(t1, t2);
        const c = centerPt(t1, t2);
        const nextScale = Math.max(0.35, Math.min(3.2, gesture.startScale * (newDist / gesture.startDist)));
        const nextRotation = gesture.startRotation + (newAngle - gesture.startAngle);
        const nextX = gesture.startX + (c.x - gesture.startCenter.x);
        const nextY = gesture.startY + (c.y - gesture.startCenter.y);
        scheduleTransform(nextX, nextY, nextScale, nextRotation);
      }
    }, { passive: false });

    el.addEventListener("touchend", () => {
      clearPress();
      dragging = false;
      gesture = null;
      persistBoard();
    });

    el.addEventListener("touchcancel", () => {
      clearPress();
      dragging = false;
      gesture = null;
      persistBoard();
    });

    // mouse fallback
    let mouseDown = false;
    el.addEventListener("mousedown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      state.selectedBoardId = item.id;
      updateSelectionVisuals();
      mouseDown = true;
      onSinglePointStart(e.clientX, e.clientY);
    });

    window.addEventListener("mousemove", (e) => {
      if(!mouseDown) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(dragging){
        scheduleTransform(startItemX + dx, startItemY + dy, item.scale, item.rotation);
      } else if(Math.hypot(dx, dy) > 5){
        clearPress();
      }
    });

    window.addEventListener("mouseup", () => {
      if(mouseDown){
        mouseDown = false;
        clearPress();
        dragging = false;
        persistBoard();
      }
    });
  }

  board.addEventListener("click", (e) => {
    if(e.target === board){
      state.selectedBoardId = null;
      hideMenu();
      updateSelectionVisuals();
    }
  });

  function distance(a,b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  function angleDeg(a,b){ return Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) * 180 / Math.PI; }
  function centerPt(a,b){ return { x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2 }; }

  function reorderSelected(mode){
    if(state.selectedBoardId == null){
      alert("请先选中一个贴纸");
      return;
    }
    const sorted = [...state.boardItems].sort((a,b) => a.z - b.z);
    const cur = sorted.findIndex(x => x.id === state.selectedBoardId);
    if(cur < 0) return;

    if(mode === "front" && cur < sorted.length - 1){
      const it = sorted.splice(cur, 1)[0];
      sorted.push(it);
    }else if(mode === "back" && cur > 0){
      const it = sorted.splice(cur, 1)[0];
      sorted.unshift(it);
    }else if(mode === "up" && cur < sorted.length - 1){
      [sorted[cur], sorted[cur+1]] = [sorted[cur+1], sorted[cur]];
    }else if(mode === "down" && cur > 0){
      [sorted[cur], sorted[cur-1]] = [sorted[cur-1], sorted[cur]];
    }

    sorted.forEach((it, i) => it.z = i);
    state.boardItems = sorted;
    persistBoard();
    renderBoard();
  }

  function deleteSelected(){
    if(state.selectedBoardId == null){
      alert("请先选中一个贴纸");
      return;
    }
    state.boardItems = state.boardItems.filter(x => x.id !== state.selectedBoardId);
    state.selectedBoardId = null;
    persistBoard();
    hideMenu();
    renderBoard();
  }

  function renderGallery(){
    if(!state.libraryItems.length){
      gallery.innerHTML = "暂无贴纸";
      return;
    }

    gallery.innerHTML = state.libraryItems.map(item => `
      <div class="thumb">
        <img src="${item.src}" alt="">
        <div class="cap">${item.subject || "未知主体"}<br>${item.createdAt || ""}</div>
        <div class="thumb-actions">
          <button class="small-btn use" data-use="${item.id}">加入沙盘</button>
          <button class="small-btn del" data-del="${item.id}">删除</button>
        </div>
      </div>
    `).join("");

    gallery.querySelectorAll("[data-use]").forEach(btn => {
      btn.addEventListener("click", () => addLibraryToBoard(Number(btn.dataset.use)));
    });
    gallery.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => deleteLibraryItem(Number(btn.dataset.del)));
    });
  }

  async function shareBoardImage(){
    if(!state.boardItems.length){
      alert("沙盘还没有贴纸");
      return;
    }
    try{
      const blob = await exportBoardToBlob();
      const file = new File([blob], "auroramap-board.png", { type: "image/png" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({
          title: "AuroraMap 沙盘贴纸",
          text: "这是我制作的 AuroraMap 贴纸沙盘",
          files: [file]
        });
      }else{
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "auroramap-board.png";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }catch(err){
      alert("分享失败：" + (err.message || err));
    }
  }

  async function exportBoardToBlob(){
    const rect = board.getBoundingClientRect();
    const canvas = document.createElement("canvas");
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    const ctx = canvas.getContext("2d");
    ctx.scale(2, 2);

    const grad = ctx.createLinearGradient(0,0,0,rect.height);
    grad.addColorStop(0, "#f6e2af");
    grad.addColorStop(1, "#deb572");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,rect.width,rect.height);

    ctx.fillStyle = "rgba(255,255,255,.28)";
    for(let y=16;y<rect.height;y+=34){
      for(let x=16;x<rect.width;x+=34){
        ctx.beginPath();
        ctx.arc(x,y,2,0,Math.PI*2);
        ctx.fill();
      }
    }

    const sorted = [...state.boardItems].sort((a,b) => (a.z||0) - (b.z||0));
    for(const item of sorted){
      const img = await loadImage(item.src);
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rotation * Math.PI / 180);
      ctx.scale(item.scale, item.scale);
      const width = BASE_WIDTH;
      const height = img.height / img.width * width;
      ctx.drawImage(img, -width/2, -height/2, width, height);
      ctx.restore();
    }
    return await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  }

  async function compressDataUrl(dataUrl, maxSide = 1200, quality = 0.82){
    const img = await loadImage(dataUrl);
    const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * ratio));
    const h = Math.max(1, Math.round(img.height * ratio));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function fileToDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function blobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function dataUrlToBlob(dataUrl){
    const arr = dataUrl.split(",");
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while(n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
  }

  function loadImage(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  renderBoard();
  renderGallery();
})();
</script>
