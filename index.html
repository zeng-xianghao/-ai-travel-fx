<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AuroraMap AI</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:
linear-gradient(135deg,#dbeafe,#f5f3ff);

font-family:
Arial,
"Microsoft YaHei";

}



.app{

max-width:430px;

margin:auto;

padding:20px;

}



.logo{

font-size:30px;

font-weight:900;

margin-bottom:20px;

}



.card{

background:
rgba(255,255,255,.75);

backdrop-filter:blur(20px);

border-radius:28px;

padding:20px;

margin-bottom:20px;

box-shadow:0 15px 40px #0002;

}



.preview{

height:260px;

border-radius:25px;

border:2px dashed #60a5fa;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:white;

}



.preview img{

width:100%;

height:100%;

object-fit:cover;

}



input{

display:none;

}



button{

width:100%;

height:55px;

border:0;

border-radius:30px;

margin-top:15px;

background:
linear-gradient(135deg,#2563eb,#7c3aed);

color:white;

font-size:18px;

font-weight:bold;

}



.status{

padding:15px;

border-radius:20px;

background:#eff6ff;

}



.money{

font-size:35px;

font-weight:900;

color:#16a34a;

}


</style>


</head>



<body>


<div class="app">


<div class="logo">

🌌 AuroraMap

</div>




<div class="card">


<label class="preview"
for="file">


<img id="img">


<span id="tip">

📷 拍摄价格 / 小票

</span>


</label>


<input

id="file"

type="file"

accept="image/*"

capture="environment">



<button id="scan">

🤖 AI识别价格

</button>


</div>





<div class="card">


<div id="status"
class="status">

等待图片

</div>



<div id="result">

</div>


</div>



</div>





<script>


let imageBase64="";



const file=
document.getElementById("file");


const img=
document.getElementById("img");


const tip=
document.getElementById("tip");


const status=
document.getElementById("status");


const result=
document.getElementById("result");





// 图片压缩


file.onchange=function(e){



let f=e.target.files[0];


if(!f)return;



let reader=
new FileReader();



reader.onload=function(e){



let image=new Image();



image.onload=function(){



let canvas=
document.createElement("canvas");


let max=700;



let scale=max/image.width;



canvas.width=max;


canvas.height=
image.height*scale;



let ctx=
canvas.getContext("2d");



ctx.drawImage(

image,

0,

0,

canvas.width,

canvas.height

);



imageBase64=
canvas.toDataURL(
"image/jpeg",
0.45
);



img.src=imageBase64;


tip.style.display="none";



}



image.src=e.target.result;


}



reader.readAsDataURL(f);



};





// 图片复杂度判断


function detectMode(){



/*

简单规则：

图片尺寸小
文字少

走快速模型


*/


let length=
imageBase64.length;



if(length<300000){

return "fast";

}



return "deep";


}






document
.getElementById("scan")
.onclick=
async()=>{


if(!imageBase64){

alert("请先拍照");

return;

}



let mode=
detectMode();



if(mode==="fast"){


status.innerHTML=

"⚡ 快速模式<br>正在使用 gpt-6-sol";


}else{


status.innerHTML=

"🧠 深度模式<br>正在使用 gpt-6-luna";


}





result.innerHTML="";



try{


let response=
await fetch(
"/api/vision",
{


method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

image:imageBase64,

mode:mode

})


});



let data=
await response.json();



if(data.error){

throw Error(data.error);

}




result.innerHTML=

`

<h2>

${data.country||"未知国家"}

</h2>


<p>

货币：

${data.currency}

</p>


<h2>

${data.symbol||""}${data.amount}

</h2>



<hr>


人民币：

<div class="money">

¥${data.cny||"--"}

</div>

`;



status.innerHTML=

"✅ 识别完成";



}

catch(e){


status.innerHTML=

"❌ "+e.message;


}



};



</script>


</body>


</html>
