<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuroraMap AI</title>
<style>
body{margin:0;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-family:Arial,"Microsoft YaHei"}
.app{max-width:430px;margin:auto;padding:20px}.card{background:#ffffffcc;border-radius:25px;padding:20px;margin:20px 0}
button{width:100%;height:55px;border:0;border-radius:30px;background:#2563eb;color:white;font-size:18px}
.preview{height:240px;border:2px dashed #60a5fa;display:flex;align-items:center;justify-content:center;border-radius:20px;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}input{display:none}.money{font-size:32px;color:#16a34a;font-weight:bold}
</style>
</head>
<body>
<div class="app">
<h1>🌌 AuroraMap</h1>
<div class="card">
<label class="preview" for="file"><img id="img"><span id="tip">📷 上传图片</span></label>
<input id="file" type="file" accept="image/*" capture="environment">
<button id="scan">🤖 AI识别</button>
</div>
<div class="card"><div id="status">等待</div><div id="result"></div></div>
</div>
<script>
let image="";
file.onchange=e=>{let r=new FileReader();r.onload=x=>{let i=new Image();i.onload=()=>{let c=document.createElement("canvas"),s=700/i.width;c.width=700;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);image=c.toDataURL("image/jpeg",.45);img.src=image;tip.style.display="none"};i.src=x.target.result};r.readAsDataURL(e.target.files[0])};
scan.onclick=async()=>{if(!image)return alert("请上传图片");let mode=image.length>300000?"deep":"fast";status.innerHTML=mode==="fast"?"⚡gpt-6-sol":"🧠gpt-6-luna";let r=await fetch("/api/vision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image,mode})});let d=await r.json();result.innerHTML=`${d.country||""}<br>${d.currency||""}<h2>${d.symbol||""}${d.amount||""}</h2><div class="money">¥${d.cny||"-"}</div>`}
</script>
</body>
</html>
