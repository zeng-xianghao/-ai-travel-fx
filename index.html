<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuroraMap V10.8</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei";background:linear-gradient(135deg,#dbeafe,#ede9fe)}
.app{max-width:430px;margin:auto;padding:18px 18px 90px}
.card{background:#ffffffcc;border-radius:26px;padding:18px;margin:15px 0;box-shadow:0 10px 30px #0002}
button{width:100%;height:50px;border:0;border-radius:25px;background:#2563eb;color:white;font-weight:800;margin-top:10px}
.page{display:none}.page.active{display:block}
.preview{height:230px;border:2px dashed #60a5fa;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{max-width:100%;max-height:100%}
input{display:none}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center}
.sandbox{height:300px;border-radius:25px;background:
radial-gradient(circle,#fff4 2px,transparent 3px) 0 0/30px 30px,
linear-gradient(#f3d49b,#ddb36d);position:relative;overflow:hidden}
.sticker{position:absolute;width:110px;cursor:move;filter:drop-shadow(0 8px 8px #555)}
</style>
</head>
<body>
<div class="app">
<h1>🌌 AuroraMap</h1>

<div id="home" class="page active card">
<h2>首页</h2>
<button onclick="showPage('sticker')">🏷 贴纸区</button>
<button onclick="showPage('camera')">📷 识别</button>
<button onclick="showPage('travel')">🗺旅行记录</button>
</div>

<div id="camera" class="page card">
<h2>📷识别</h2>
<input id="cameraFile" type="file" accept="image/*">
<button onclick="cameraFile.click()">选择图片</button>
<button id="scan">AI识别</button>
<div id="result"></div>
</div>

<div id="travel" class="page card">
<h2>🗺旅行记录</h2>
<div id="records">暂无记录</div>
</div>

<div id="sticker" class="page card">
<h2>🏷贴纸区</h2>
<input id="stickerFile" type="file" accept="image/*">
<button onclick="stickerFile.click()">上传图片</button>
<div class="preview"><img id="stickerPreview"></div>
<button id="makeSticker">生成厚白边贴纸</button>
<button id="saveSticker">保存到沙盘</button>
<button id="clearBoard">清空沙盘</button>

<h3>🏖贴纸沙盘</h3>
<div id="board" class="sandbox"></div>

<h3>贴纸库</h3>
<div id="library"></div>
</div>

</div>

<nav>
<div onclick="showPage('home')">🏠</div>
<div onclick="showPage('camera')">📷</div>
<div onclick="showPage('travel')">🗺</div>
<div onclick="showPage('sticker')">🏷</div>
</nav>

<script>
function showPage(id){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

let stickerData="";
let library=JSON.parse(localStorage.getItem("aurora_stickers")||"[]");

stickerFile.onchange=e=>{
let r=new FileReader();
r.onload=x=>{
stickerData=x.target.result;
stickerPreview.src=stickerData;
};
r.readAsDataURL(e.target.files[0]);
};


// 白边厚度扩大2倍
makeSticker.onclick=()=>{
if(!stickerData)return alert("请上传图片");

let img=new Image();
img.onload=()=>{

let c=document.createElement("canvas");
let border=80;

c.width=img.width+border*2;
c.height=img.height+border*2;

let ctx=c.getContext("2d");

// 模拟不规则厚白边
ctx.shadowColor="white";
ctx.shadowBlur=80;

ctx.drawImage(
img,
border,
border
);

ctx.shadowBlur=0;

stickerData=c.toDataURL("image/png");
stickerPreview.src=stickerData;

};
img.src=stickerData;
};


saveSticker.onclick=()=>{
if(!stickerData)return;

library.push({
img:stickerData,
x:30,
y:30,
time:new Date().toLocaleString()
});

localStorage.setItem(
"aurora_stickers",
JSON.stringify(library)
);

renderBoard();
};


function renderBoard(){

board.innerHTML="";

library.forEach((item,index)=>{

let img=document.createElement("img");

img.src=item.img;

img.className="sticker";

img.style.left=item.x+"px";
img.style.top=item.y+"px";


let startX,startY;

img.onpointerdown=e=>{

startX=e.clientX-item.x;
startY=e.clientY-item.y;

img.setPointerCapture(e.pointerId);

img.onpointermove=e=>{

item.x=e.clientX-startX;
item.y=e.clientY-startY;

img.style.left=item.x+"px";
img.style.top=item.y+"px";

};

img.onpointerup=()=>{

localStorage.setItem(
"aurora_stickers",
JSON.stringify(library)
);

};

};


board.appendChild(img);

});


library.forEach((x,i)=>{

let p=document.createElement("p");
p.innerHTML=`贴纸 ${i+1} <button onclick="deleteSticker(${i})">删除</button>`;
libraryDiv.appendChild(p);

});

}

function deleteSticker(i){
library.splice(i,1);
localStorage.setItem("aurora_stickers",JSON.stringify(library));
renderBoard();
}

clearBoard.onclick=()=>{
library=[];
localStorage.removeItem("aurora_stickers");
renderBoard();
};

let libraryDiv=document.getElementById("library");

renderBoard();

</script>
</body>
</html>
