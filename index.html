<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">


<title>
AI旅行汇率助手
</title>


<style>

body{

margin:0;

background:#f3f6fb;

font-family:
Arial,
"Microsoft YaHei";

}



.app{

max-width:420px;

margin:auto;

padding:20px;

}



.card{

background:white;

padding:20px;

border-radius:25px;

margin-bottom:20px;

box-shadow:
0 10px 30px #0002;

}



h1{

font-size:26px;

}



input,
button{


width:100%;

padding:15px;

border-radius:15px;

margin-top:15px;

font-size:16px;

}



button{

background:#2563eb;

color:white;

border:0;

}



img{

width:100%;

border-radius:20px;

margin-top:15px;

}



.result{

background:#eef6ff;

padding:20px;

border-radius:20px;

line-height:1.8;

}



.flag{

font-size:40px;

}



</style>

</head>


<body>


<div class="app">


<h1>
🌍 AI旅行汇率助手
</h1>


<div class="card">


<input

id="file"

type="file"

accept="image/*"

capture="environment">



<img id="preview">



<button onclick="runAI()">

📷 识别价格

</button>


</div>



<div class="card">


<div id="result"
class="result">

等待图片...

</div>



<button onclick="voice()">

🔊 播报结果

</button>


</div>


</div>



<script>


let img64="";

let speakText="";



file.onchange=e=>{


let f=e.target.files[0];


let reader=new FileReader();



reader.onload=x=>{


let img=new Image();


img.onload=()=>{


let canvas=document.createElement("canvas");


let scale=
900/img.width;


canvas.width=900;

canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);



img64=
canvas.toDataURL(
"image/jpeg",
0.65
);



preview.src=img64;


}



img.src=x.target.result;


}



reader.readAsDataURL(f);


}




async function runAI(){


result.innerHTML=
"🤖 AI识别中...";



let r=
await fetch(
"/api/vision",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

image:img64

})

}

);



let data=
await r.json();



let flag="🌍";


let map={

China:"🇨🇳",

Japan:"🇯🇵",

United States:"🇺🇸",

USA:"🇺🇸",

Korea:"🇰🇷",

France:"🇫🇷",

Germany:"🇩🇪"

};


if(map[data.country])

flag=map[data.country];



speakText=

`${data.amount}${data.currency}，约${data.cny}人民币`;



result.innerHTML=

`

<div class="flag">
${flag}
</div>


国家：

${data.country || ""}


<br>

货币：

${data.currency || ""}


<br>

价格：

${data.symbol || ""}${data.amount || ""}


<hr>


人民币：

<b>
¥${data.cny || "计算失败"}
</b>

`;



}




function voice(){


let u=
new SpeechSynthesisUtterance(
speakText
);


u.lang="zh-CN";


speechSynthesis.speak(u);


}



</script>


</body>

</html>
