<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AuroraMap AI Sticker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial;background:linear-gradient(135deg,#dbeafe,#ede9fe)}
.app{max-width:430px;margin:auto;padding:16px 16px 90px}
.card{background:rgba(255,255,255,.88);border-radius:24px;padding:16px;margin-bottom:16px;box-shadow:0 8px 25px #0001}
h2{margin:0 0 12px}
button{width:100%;height:48px;border:0;border-radius:24px;background:#2563eb;color:#fff;font-weight:700;margin-top:10px}
input{display:none}
.preview{height:220px;border:2px dashed #60a5fa;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.sandbox{height:380px;border-radius:25px;overflow:hidden;position:relative;
background:radial-gradient(circle,#ffffff66 2px,transparent 3px) 0 0/35px 35px,linear-gradient(#f4dda8,#d9ae67)}
.sticker{position:absolute;width:110px;touch-action:none;filter:drop-shadow(0 10px 12px #0004)}
.info{padding:12px;background:#eff6ff;border-radius:16px}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -5px 20px #0002}
</style>
</head>
<body>
<div class="app">
<div class="card"><h2>🌌 AuroraMap</h2><div>AI旅行贴纸工作室</div></div>

<div class="card">
<h2>🏷 AI主体贴纸</h2>
<input id="file" type="file" accept="image/*" capture="environment">
<button id="pick">上传图片</button>
<div class="preview"><img id="preview"></div>
<div id="info" class="info">等待图片</div>
<button id="create">✨ AI抠图生成贴纸</button>
<button id="save">💾保存到沙盘</button>
</div>

<div class="card">
<h2>🏖 旅行贴纸沙盘</h2>
<div id="board" class="sandbox"></div>
</div>
</div>

<nav>
<div>🏠<br>首页</div>
<div>📷<br>拍照</div>
<div>🏷<br>贴纸</div>
<div>👤<br>我的</div>
</nav>

<script>
let source="";
let sticker="";
let list=JSON.parse(localStorage.getItem("aurora_stickers_v109")||"[]");

const $=id=>document.getElementById(id);

$("pick").onclick=()=>file.click();

file.onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=x=>{
  source=x.target.result;
  preview.src=source;
  info.innerHTML="图片已上传";
 };
 r.readAsDataURL(f);
};

$("create").onclick=async()=>{
 if(!source)return alert("请上传图片");
 info.innerHTML="AI识别主体中...";
 try{
  const r=await fetch("/api/sticker",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({image:source})
  });
  const d=await r.json();
  info.innerHTML="主体："+(d.subject||"物品")+" / "+(d.type||"object");
  sticker=await makeSticker(source);
  preview.src=sticker;
 }catch(e){
  info.innerHTML="生成失败";
 }
};

$("save").onclick=()=>{
 if(!sticker)return;
 list.push({img:sticker,x:30+list.length*10,y:30+list.length*10,r:0});
 localStorage.setItem("aurora_stickers_v109",JSON.stringify(list));
 render();
};

function render(){
 board.innerHTML="";
 list.forEach((s,i)=>{
  const img=document.createElement("img");
  img.src=s.img;
  img.className="sticker";
  img.style.left=s.x+"px";
  img.style.top=s.y+"px";
  img.style.transform="rotate("+s.r+"deg)";
  drag(img,s);
  board.appendChild(img);
 });
}

function drag(el,obj){
 let sx,sy;
 el.ontouchstart=e=>{
  let t=e.touches[0];
  sx=t.clientX-obj.x; sy=t.clientY-obj.y;
  el.ontouchmove=e=>{
   let t=e.touches[0];
   obj.x=t.clientX-sx;
   obj.y=t.clientY-sy;
   el.style.left=obj.x+"px";
   el.style.top=obj.y+"px";
  };
 };
}

function makeSticker(src){
 return new Promise(resolve=>{
  let i=new Image();
  i.onload=()=>{
   let c=document.createElement("canvas");
   let b=100;
   c.width=i.width+b*2;
   c.height=i.height+b*2;
   let x=c.getContext("2d");
   x.shadowColor="#fff";
   x.shadowBlur=100;
   x.drawImage(i,b,b);
   x.shadowBlur=0;
   x.drawImage(i,b,b);
   resolve(c.toDataURL("image/png"));
  };
  i.src=src;
 });
}

render();
</script>
</body>
</html>
