<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
AI旅行汇率助手
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
linear-gradient(135deg,#dbeafe,#ede9fe);

font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei";

}



.container{

max-width:430px;

margin:auto;

padding:25px;

}



.title{

font-size:30px;

font-weight:800;

margin-bottom:25px;

}



.box{

background:
rgba(255,255,255,.75);

backdrop-filter:blur(20px);

border-radius:30px;

padding:22px;

margin-bottom:20px;

box-shadow:
0 15px 40px rgba(0,0,0,.12);

}



.photo{

height:260px;

border-radius:25px;

background:#f8fafc;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

border:2px dashed #93c5fd;

}



.photo img{

width:100%;

height:100%;

object-fit:cover;

}



input{

display:none;

}



.btn{

width:100%;

height:58px;

margin-top:20px;

border:0;

border-radius:30px;

background:
linear-gradient(135deg,#2563eb,#4f46e5);

color:white;

font-size:18px;

font-weight:bold;

}



.result{

font-size:17px;

line-height:1.8;

}



.loading{

text-align:center;

color:#2563eb;

}



.money{

font-size:34px;

font-weight:800;

color:#16a34a;

}



.flag{

font-size:55px;

}



.error{

color:#dc2626;

}


</style>


</head>


<body>


<div class="container">


<div class="title">

🌍 AI旅行汇率助手

</div>



<div class="box">


<label class="photo" for="file">


<img id="preview">


<span id="tip">

📷 点击上传照片

</span>


</label>


<input

id="file"

type="file"

accept="image/*"

capture="environment">



<button

id="scanBtn"

class="btn">

🤖 识别价格

</button>


</div>




<div class="box">


<div id="result" class="result">

等待识别...

</div>


<button

id="voiceBtn"

class="btn">

🔊 播报结果

</button>


</div>



</div>



<script>


document.addEventListener(
"DOMContentLoaded",
()=>{


let imageBase64="";

let voiceText="";



const file =
document.getElementById("file");


const preview =
document.getElementById("preview");


const tip =
document.getElementById("tip");


const scanBtn =
document.getElementById("scanBtn");


const result =
document.getElementById("result");


const voiceBtn =
document.getElementById("voiceBtn");




//选择图片


file.addEventListener(
"change",
function(){



let imgFile=this.files[0];


if(!imgFile){

return;

}



let reader=
new FileReader();



reader.onload=function(e){



let img=new Image();



img.onload=function(){



let canvas=
document.createElement("canvas");



let max=900;


let scale=max/img.width;



canvas.width=max;


canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");


ctx.drawImage(

img,

0,

0,

canvas.width,

canvas.height

);



imageBase64=
canvas.toDataURL(
"image/jpeg",
0.65
);



preview.src=imageBase64;


tip.style.display="none";


}



img.src=e.target.result;



}



reader.readAsDataURL(imgFile);



});





//识别按钮


scanBtn.addEventListener(
"click",
async function(){



if(!imageBase64){

alert("请先上传照片");

return;

}



result.innerHTML=

`

<div class="loading">

🤖 AI正在识别...

<br>

请等待

</div>

`;



scanBtn.innerHTML=
"分析中...";



try{


let controller=
new AbortController();


let timer=
setTimeout(
()=>controller.abort(),
60000
);



let response=
await fetch(
"/api/vision",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

image:imageBase64

}),

signal:
controller.signal

});


clearTimeout(timer);



let data=
await response.json();



console.log(data);



if(data.error){

throw new Error(data.error);

}



let flag="🌍";


const countryFlag={


China:"🇨🇳",

Japan:"🇯🇵",

USA:"🇺🇸",

"United States":"🇺🇸",

Korea:"🇰🇷",

France:"🇫🇷",

Germany:"🇩🇪"

};



if(countryFlag[data.country]){

flag=
countryFlag[data.country];

}



voiceText=

`${data.amount}${data.currency}，约${data.cny}人民币`;



result.innerHTML=

`

<div class="flag">

${flag}

</div>


国家：

${data.country || "-"}

<br>


货币：

${data.currency || "-"}

<br><br>


原价：

<h2>

${data.symbol || ""}${data.amount || "-"}

</h2>


人民币：

<div class="money">

¥${data.cny || "-"}

</div>

`;



}


catch(err){


result.innerHTML=

`

<div class="error">

❌ 识别失败

<br><br>

${err.message}

</div>

`;



}



scanBtn.innerHTML=
"🤖 识别价格";



});




//语音


voiceBtn.addEventListener(
"click",
()=>{


if(!voiceText){

alert("没有识别结果");

return;

}



let u=
new SpeechSynthesisUtterance(
voiceText
);


u.lang="zh-CN";


speechSynthesis.speak(u);


});


});

</script>


</body>

</html>
