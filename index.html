<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI旅行汇率助手</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
background:#f3f6fb;
font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei";

display:flex;
justify-content:center;

}


.app{

width:420px;
padding:20px;

}


.card{

background:white;
border-radius:24px;
padding:20px;
margin-bottom:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}


h1{

font-size:28px;

}


input,
button{

width:100%;
padding:15px;

border-radius:15px;

font-size:16px;

margin-top:15px;

}


input{

border:1px solid #ddd;

}


button{

background:#2563eb;

color:white;

border:none;

}


img{

width:100%;

border-radius:20px;

margin-top:15px;

}


.result{

margin-top:20px;

background:#eef6ff;

padding:20px;

border-radius:20px;

line-height:1.8;

font-size:16px;

}

.loading{

color:#2563eb;

}

.error{

color:red;

}


</style>

</head>


<body>


<div class="app">


<h1>
🌍 AI旅行汇率助手
</h1>


<div class="card">


<input

id="photo"

type="file"

accept="image/*"

capture="environment">


<img id="preview">


<button onclick="analyze()">

📷 AI识别价格

</button>


</div>



<div class="card">


<div id="result" class="result">

等待上传图片...

</div>


</div>


</div>



<script>


const API_URL =
"https://ai-travel-fx.vercel.app/api/vision";


let imageBase64="";



/*
 图片压缩
 解决 Vercel 413
*/


photo.onchange=function(){


let file=this.files[0];


if(!file)return;



let img=new Image();


let reader=new FileReader();



reader.onload=function(e){


img.onload=function(){



let canvas=document.createElement("canvas");


let maxWidth=900;


let scale=maxWidth/img.width;



canvas.width=maxWidth;


canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");



ctx.drawImage(

img,

0,

0,

canvas.width,

canvas.height

);



imageBase64=
canvas.toDataURL(

"image/jpeg",

0.65

);



preview.src=imageBase64;



}



img.src=e.target.result;



}



reader.readAsDataURL(file);


}




async function analyze(){



if(!imageBase64){

alert("请先拍照");

return;

}



result.className="result loading";

result.innerHTML=
"🤖 AI正在分析图片，请等待...";



try{


let response=

await fetch(API_URL,{


method:"POST",


headers:{


"Content-Type":
"application/json"


},


body:JSON.stringify({

image:imageBase64

})


});



let data=
await response.json();



console.log(data);



if(data.error){

throw new Error(data.error);

}



result.className="result";


result.innerHTML=

`

✅ 识别成功

<br><br>

${data.result}

`;



}

catch(err){


result.className="result error";


result.innerHTML=

`

❌ AI连接失败

<br><br>

${err.message}

`;

console.error(err);


}



}



</script>


</body>


</html>
