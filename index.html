<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
AI旅行汇率助手 V9
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

background:
linear-gradient(
135deg,
#dbeafe,
#ede9fe
);

font-family:

-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei";

}



.container{

max-width:430px;

margin:auto;

padding:20px;

}



.title{

font-size:30px;

font-weight:900;

margin:15px 0 25px;

}



.glass{

background:
rgba(255,255,255,.72);

backdrop-filter:
blur(25px);

border-radius:30px;

padding:22px;

margin-bottom:20px;

box-shadow:
0 20px 50px rgba(0,0,0,.12);

}



.photo{

height:250px;

border-radius:25px;

overflow:hidden;

border:2px dashed #60a5fa;

display:flex;

align-items:center;

justify-content:center;

background:white;

}



.photo img{

width:100%;

height:100%;

object-fit:cover;

}



input[type=file]{

display:none;

}



button{

width:100%;

height:55px;

border:0;

border-radius:30px;

background:
linear-gradient(
135deg,
#2563eb,
#4f46e5
);

color:white;

font-size:17px;

font-weight:bold;

margin-top:15px;

}



select,input{

width:100%;

height:45px;

border-radius:15px;

border:1px solid #ddd;

padding:10px;

margin-top:10px;

font-size:16px;

}



.result{

line-height:1.8;

font-size:16px;

}



.flag{

font-size:55px;

}



.money{

font-size:32px;

font-weight:900;

color:#16a34a;

}



.history-item{

background:#f8fafc;

padding:15px;

border-radius:18px;

margin-top:10px;

}



.loading{

text-align:center;

color:#2563eb;

}



.small{

font-size:13px;

color:#64748b;

}



</style>


</head>



<body>


<div class="container">



<div class="title">

🌍 AI旅行汇率助手

</div>




<div class="glass">


<label class="photo" for="file">


<img id="preview">


<div id="empty">

📷 点击拍照

</div>


</label>



<input

id="file"

type="file"

accept="image/*"

capture="environment">



<button id="scan">

🤖 OCR + AI识别

</button>


<div class="small">

OCR快速读取数字，AI确认国家和货币

</div>


</div>





<div class="glass">


<h3>

💱 转换目标货币

</h3>



<select id="currency">


<option value="CNY">

🇨🇳 人民币 CNY

</option>


<option value="USD">

🇺🇸 美元 USD

</option>


<option value="EUR">

🇪🇺 欧元 EUR

</option>


<option value="JPY">

🇯🇵 日元 JPY

</option>


<option value="GBP">

🇬🇧 英镑 GBP

</option>


<option value="KRW">

🇰🇷 韩元 KRW

</option>


</select>



<input

id="custom"

placeholder="输入其它货币，例如 CAD / AUD / THB">



<button id="convert">

🔄 转换货币

</button>



</div>





<div class="glass">


<div id="result" class="result">

等待识别...

</div>



<button id="voice">

🔊 播报结果

</button>


</div>




<div class="glass">


<h3>

🕘 最近记录

</h3>



<div id="history">

暂无记录

</div>


</div>



</div>






<script>


let imageBase64="";

let currentData=null;

let voiceText="";





const file=
document.getElementById("file");


const preview=
document.getElementById("preview");


const empty=
document.getElementById("empty");


const result=
document.getElementById("result");



/*
上传图片 + 压缩
*/


file.addEventListener(
"change",
e=>{


let f=e.target.files[0];


if(!f)return;



let reader=
new FileReader();



reader.onload=e=>{


let img=new Image();



img.onload=()=>{


let canvas=
document.createElement("canvas");



let max=900;



let scale=max/img.width;



canvas.width=max;

canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");



ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);



imageBase64=
canvas.toDataURL(
"image/jpeg",
0.65
);



preview.src=imageBase64;

empty.style.display="none";


}



img.src=e.target.result;


}



reader.readAsDataURL(f);


});





/*
OCR模拟快速层

提取图片已有数字
后续可接Tesseract
*/


function quickOCR(){


return {

numbers:""

};


}






/*
AI识别
*/


document
.getElementById("scan")
.onclick=async()=>{


if(!imageBase64){

alert("请先拍照");

return;

}



result.innerHTML=

`

<div class="loading">

🔎 OCR扫描...

<br>

🤖 AI分析中...

</div>

`;



try{


let res=
await fetch(
"/api/vision",
{


method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

image:imageBase64,

ocr:quickOCR()

})


});



let data=
await res.json();



if(data.error){

throw Error(data.error);

}



currentData=data;



showResult(data);



saveHistory(data);



}


catch(e){


result.innerHTML=

"❌ "+e.message;


}



};






function showResult(data){



let flag="🌍";



let flags={

Indonesia:"🇮🇩",

China:"🇨🇳",

Japan:"🇯🇵",

USA:"🇺🇸",

"United States":"🇺🇸",

Korea:"🇰🇷",

France:"🇫🇷"

};



if(flags[data.country])

flag=flags[data.country];





voiceText=

`${data.amount}${data.currency}，约${data.cny}人民币`;



result.innerHTML=

`

<div class="flag">

${flag}

</div>


国家：

${data.country}


<br>


货币：

${data.currency}


<br>


金额：

<h2>

${data.symbol || ""}${data.amount}

</h2>



人民币：

<div class="money">

¥${data.cny || "-"}

</div>

`;



}





/*
自定义货币转换
*/


document
.getElementById("convert")
.onclick=async()=>{


if(!currentData){

alert("请先识别");

return;

}



let target=
document.getElementById("custom").value
||
document.getElementById("currency").value;



let from=
currentData.currencyCode;



let amount=
Number(currentData.amount);



try{


let r=
await fetch(

`https://open.er-api.com/v6/latest/${from}`

);



let d=
await r.json();



let rate=
d.rates[target];



let value=
(
amount*rate

).toFixed(2);



result.innerHTML+=

`

<hr>

转换：

${target}

<br>

<b>

${value}

${target}

</b>

`;



}

catch{

alert("转换失败");

}


};






/*
历史记录
*/


function saveHistory(data){


let list=
JSON.parse(
localStorage.history||"[]"
);



list.unshift({

country:data.country,

currency:data.currency,

amount:data.amount,

cny:data.cny,

time:new Date()
.toLocaleString()

});



list=list.slice(0,10);



localStorage.history=
JSON.stringify(list);



loadHistory();


}





function loadHistory(){


let box=
document.getElementById("history");


let list=
JSON.parse(
localStorage.history||"[]"
);



if(!list.length){

box.innerHTML="暂无记录";

return;

}



box.innerHTML=
list.map(x=>


`

<div class="history-item">

🌍 ${x.country}

<br>

${x.amount} ${x.currency}

<br>

≈ ¥${x.cny}

<br>

<small>${x.time}</small>

</div>

`

).join("");



}


loadHistory();






/*
语音
*/


document
.getElementById("voice")
.onclick=()=>{


if(!voiceText){

alert("没有结果");

return;

}



let u=
new SpeechSynthesisUtterance(
voiceText
);



u.lang="zh-CN";


speechSynthesis.speak(u);


};



</script>


</body>

</html>
