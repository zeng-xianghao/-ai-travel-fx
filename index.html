<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuroraMap V10.7.1</title>
<style>
body{margin:0;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-family:Arial,"Microsoft YaHei"}
.app{max-width:430px;margin:auto;padding:20px 20px 90px}
.card{background:#ffffffcc;border-radius:24px;padding:18px;margin:15px 0}
button{width:100%;height:50px;border:0;border-radius:25px;background:#2563eb;color:white;margin-top:10px;font-weight:bold}
.page{display:none}.active{display:block}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:white;display:flex;justify-content:space-around;align-items:center}
.preview{height:220px;border:2px dashed #60a5fa;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{max-width:100%;max-height:100%}
input{display:none}.sandbox{height:260px;border-radius:25px;background:#efd39a;position:relative;overflow:hidden}.sticker{width:100px;position:absolute;filter:drop-shadow(0 8px 8px #777)}
.money{font-size:30px;color:#16a34a;font-weight:bold}
</style></head>
<body><div class="app">
<h1>🌌 AuroraMap</h1>
<div id="home" class="page active card"><h3>首页</h3><button onclick="go('camera')">📷拍照</button><button onclick="go('travel')">🗺旅行记录</button><button onclick="go('sticker')">🏷贴纸区</button></div>
<div id="camera" class="page card"><h3>AI识别</h3><label class="preview"><img id="camImg"><input id="camFile" type="file" accept="image/*">上传图片</label><button id="scan">识别</button><div id="result"></div></div>
<div id="travel" class="page card"><h3>旅行记录</h3><div id="history">暂无</div></div>
<div id="sticker" class="page card"><h3>贴纸沙盘</h3><label class="preview"><img id="stickerPreview"><input id="stickerFile" type="file" accept="image/*">上传图片</label><button id="make">生成白边贴纸</button><button id="save">保存到沙盘</button><div id="board" class="sandbox"></div></div>
</div>
<nav><div onclick="go('home')">🏠</div><div onclick="go('camera')">📷</div><div onclick="go('travel')">🗺</div><div onclick="go('sticker')">🏷</div></nav>
<script>
function go(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(x).classList.add('active')}
let img64="";
camFile.onchange=e=>{let r=new FileReader();r.onload=x=>{img64=x.target.result;camImg.src=img64};r.readAsDataURL(e.target.files[0])}
scan.onclick=async()=>{let r=await fetch('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:img64,mode:'deep'})});let d=await r.json();result.innerHTML=d.country+' '+d.currency+'<h2>'+d.amount+'</h2><div class="money">¥'+(d.cny||'-')+'</div>'}
let sticker="";
stickerFile.onchange=e=>{let r=new FileReader();r.onload=x=>{sticker=x.target.result;stickerPreview.src=sticker};r.readAsDataURL(e.target.files[0])}
make.onclick=()=>{if(sticker)stickerPreview.style.border='30px solid white'}
save.onclick=()=>{if(!sticker)return;let i=document.createElement('img');i.src=sticker;i.className='sticker';i.style.left=Math.random()*150+'px';i.style.top=Math.random()*120+'px';board.appendChild(i)}
</script></body></html>
