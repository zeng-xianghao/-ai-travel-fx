<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
AI Travel FX V10
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:
linear-gradient(135deg,#dbeafe,#ede9fe);

font-family:
-apple-system,
BlinkMacSystemFont,
"Microsoft YaHei";

}



.app{

max-width:430px;

margin:auto;

min-height:100vh;

padding-bottom:90px;

}



.header{

padding:25px;

font-size:28px;

font-weight:900;

}



.page{

display:none;

padding:20px;

}



.page.active{

display:block;

}



.glass{

background:
rgba(255,255,255,.75);

backdrop-filter:blur(20px);

border-radius:28px;

padding:20px;

margin-bottom:18px;

box-shadow:
0 15px 40px #0002;

}



.big{

font-size:32px;

font-weight:900;

}



.flag{

font-size:55px;

}



button{

width:100%;

height:55px;

border:0;

border-radius:30px;

background:
linear-gradient(
135deg,
#2563eb,
#4f46e5
);

color:white;

font-size:17px;

font-weight:bold;

}



.photo{

height:230px;

border-radius:25px;

border:2px dashed #60a5fa;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:white;

}



.photo img{

width:100%;

height:100%;

object-fit:cover;

}



input[type=file]{

display:none;

}



.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:75px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -5px 20px #0002;

}



.tab{

font-size:12px;

text-align:center;

color:#64748b;

}



.tab span{

display:block;

font-size:25px;

}



.money{

font-size:34px;

font-weight:900;

color:#16a34a;

}



.item{

background:#f8fafc;

padding:15px;

border-radius:18px;

margin-top:10px;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

🌍 AI Travel FX

</div>



<!-- 首页 -->

<div id="home" class="page active">


<div class="glass">


<div class="big">

📍 当前地区

</div>


<div id="location">

定位中...

</div>


</div>



<div class="glass">


<h2>

💱 默认货币

</h2>


<div id="currencyBox">

自动检测

</div>


</div>



<div class="glass">


<h2>

✨ 功能

</h2>


<p>
📷 AI价格识别
</p>


<p>
🧾 小票分析
</p>


<p>
🗺旅行记录
</p>


<p>
💎 Pro会员
</p>


</div>



</div>





<!-- 拍照 -->

<div id="camera" class="page">


<div class="glass">


<label class="photo"
for="file">


<img id="preview">


<div id="empty">

📷 拍照识别

</div>


</label>



<input

id="file"

type="file"

accept="image/*"

capture="environment">



<button id="scan">

🤖 AI识别价格

</button>


</div>



<div class="glass">


<div id="result">

等待识别

</div>


</div>


</div>





<!-- 小票 -->

<div id="receipt" class="page">


<div class="glass">


<h2>

🧾 小票模式

</h2>


<p>

上传小票，AI自动识别：

</p>


<p>

商品名称

<br>

价格

<br>

总金额

</p>


<button>

开始扫描

</button>


</div>


</div>





<!-- 地图 -->

<div id="map" class="page">


<div class="glass">


<h2>

🗺旅行记录地图

</h2>


<div id="history">

暂无记录

</div>


</div>


</div>





<!-- 我的 -->

<div id="user" class="page">


<div class="glass">


<h2>

👤 我的

</h2>


<p>

游客账户

</p>


<button>

登录 / 注册

</button>


</div>



<div class="glass">


<h2>

💎 Pro会员

</h2>


<p>

无限AI识别

</p>


<p>

小票模式

</p>


<p>

旅行地图

</p>


<button>

升级 Pro

</button>


</div>


</div>




<div class="bottom">


<div class="tab"
onclick="show('home')">

<span>🏠</span>
首页

</div>


<div class="tab"
onclick="show('camera')">

<span>📷</span>
拍照

</div>


<div class="tab"
onclick="show('receipt')">

<span>🧾</span>
小票

</div>


<div class="tab"
onclick="show('map')">

<span>🗺</span>
旅行

</div>


<div class="tab"
onclick="show('user')">

<span>👤</span>
我的

</div>


</div>


</div>



<script>


function show(id){


document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");


}




// 180+国家旗帜生成

function flag(code){

return code
.toUpperCase()
.replace(
/./g,
c=>
String.fromCodePoint(
127397+c.charCodeAt()
)
);

}





// GPS定位


navigator.geolocation.getCurrentPosition(

async pos=>{


let lat=
pos.coords.latitude;


let lon=
pos.coords.longitude;



location.innerHTML=

`
纬度:
${lat.toFixed(2)}
<br>
经度:
${lon.toFixed(2)}
`;


// 简化国家判断

if(
lat>20 &&
lat<50 &&
lon>70 &&
lon<140
){

currencyBox.innerHTML=

"🇨🇳 中国 CNY";

}


else if(

lon<-50

){

currencyBox.innerHTML=

"🇺🇸 美国 USD";

}


else{


currencyBox.innerHTML=

"🌍 自动模式";

}


},


()=>{


location.innerHTML=

"未授权定位";


}

);





// 图片上传


let img64="";


file.onchange=e=>{


let reader=
new FileReader();


reader.onload=x=>{


preview.src=x.target.result;

img64=x.target.result;


empty.style.display="none";


};


reader.readAsDataURL(
e.target.files[0]
);


};





// AI识别


scan.onclick=async()=>{


if(!img64){

alert("请上传图片");

return;

}



result.innerHTML=

"🤖 AI分析中...";



let r=
await fetch(
"/api/vision",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

image:img64

})

});


let data=
await r.json();



result.innerHTML=

`

<div class="flag">

🌍

</div>


国家：

${data.country}

<br>

货币：

${data.currency}

<br>

金额：

${data.symbol||""}${data.amount}


<br><br>


人民币：

<div class="money">

¥${data.cny||"-"}

</div>

`;



let list=
JSON.parse(
localStorage.history||"[]"
);


list.unshift(data);


localStorage.history=
JSON.stringify(
list.slice(0,20)
);


loadHistory();


};





function loadHistory(){


let h=
document.getElementById("history");


let list=
JSON.parse(
localStorage.history||"[]"
);



if(!list.length){

return;

}


h.innerHTML=
list.map(x=>

`
<div class="item">

🌍 ${x.country}

<br>

${x.amount} ${x.currency}

<br>

¥${x.cny||"-"}

</div>

`

).join("");

}


loadHistory();



</script>


</body>

</html>
